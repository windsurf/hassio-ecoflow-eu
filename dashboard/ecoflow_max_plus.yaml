# ============================================================
# ECOFLOW MAX PLUS DASHBOARD - v0.4.1
# ============================================================
#
# The dashboard the integration creates for the EcoFlow Delta 3 Max Plus,
# as a hand-made copy: create a new dashboard, open Edit dashboard ->
# three-dot menu -> Raw configuration editor and replace its content with
# everything below this comment block.
#
# ENTITY IDS: sensor./switch./number.ecoflow_delta_3_max_plus_*
#   Derived from the device name "EcoFlow Delta 3 Max Plus". Home Assistant
#   adds a suffix (_2) on a name clash. Check Developer tools -> States,
#   filtered on "max_plus", and edit the ids here when they differ.
#
# AC OUTPUT 2 AND DC 12V OUTPUT: these two switches are disabled by default.
#   Enable them in Settings -> Devices & services, or delete their tiles.
#   The USB ports, Beep, X-Boost, Bypass and the BMS values (App Login route)
#   are not in this dashboard; add their cards by hand if you want them.
#
# CHARTS: the History view needs ApexCharts Card from HACS.
#
# GAUGES: the power gauges run to 3000 W (GAUGE_MAX_IN_W / GAUGE_MAX_OUT_W
#   in dashboard.py).
# ============================================================
title: EcoFlow Max Plus
views:
- title: Overview
  path: overview
  type: sections
  max_columns: 4
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: EcoFlow Delta 3 Max Plus
      heading_style: title
      icon: mdi:power-plug-battery
      badges:
      - type: entity
        entity: sensor.ecoflow_delta_3_max_plus_battery_level
      - type: entity
        entity: sensor.ecoflow_delta_3_max_plus_charge_state
      - type: entity
        entity: switch.ecoflow_delta_3_max_plus_ac_output
    - type: tile
      entity: sensor.ecoflow_delta_3_max_plus_battery_level
      icon: mdi:battery-charging
    - type: tile
      entity: sensor.ecoflow_delta_3_max_plus_charge_state
      icon: mdi:battery-sync
    - type: tile
      entity: sensor.ecoflow_delta_3_max_plus_total_input_power
      icon: mdi:transmission-tower-import
    - type: tile
      entity: sensor.ecoflow_delta_3_max_plus_total_output_power
      icon: mdi:transmission-tower-export
    - type: tile
      entity: sensor.ecoflow_delta_3_max_plus_time_to_full
      icon: mdi:battery-clock
    - type: tile
      entity: sensor.ecoflow_delta_3_max_plus_remaining_run_time
      icon: mdi:timer-sand
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Overview
      heading_style: title
      icon: mdi:gauge
    - type: gauge
      entity: sensor.ecoflow_delta_3_max_plus_battery_level
      min: 0
      max: 100
      needle: true
      severity:
        green: 70
        yellow: 30
        red: 0
      grid_options:
        columns: 6
        rows: auto
    - type: gauge
      entity: sensor.ecoflow_delta_3_max_plus_total_input_power
      min: 0
      max: 3000
      needle: true
      severity:
        green: 0
        yellow: 1000
        red: 2000
      grid_options:
        columns: 6
        rows: auto
    - type: gauge
      entity: sensor.ecoflow_delta_3_max_plus_total_output_power
      min: 0
      max: 3000
      needle: true
      severity:
        green: 0
        yellow: 1500
        red: 2500
      grid_options:
        columns: 6
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Control
      heading_style: title
      icon: mdi:tune
    - type: tile
      entity: switch.ecoflow_delta_3_max_plus_ac_output
      icon: mdi:power-socket-eu
      vertical: false
    - type: tile
      entity: switch.ecoflow_delta_3_max_plus_ac_output_2
      icon: mdi:power-socket-eu
      vertical: false
    - type: tile
      entity: switch.ecoflow_delta_3_max_plus_dc_12v_output
      icon: mdi:power-socket-eu
      vertical: false
    - type: tile
      entity: switch.ecoflow_delta_3_max_plus_energy_backup
      icon: mdi:battery-heart
    - type: tile
      entity: number.ecoflow_delta_3_max_plus_charge_limit
      icon: mdi:battery-charging-high
      features:
      - type: numeric-input
        style: slider
      features_position: bottom
      vertical: false
    - type: tile
      entity: number.ecoflow_delta_3_max_plus_discharge_limit
      icon: mdi:battery-charging-low
      features:
      - type: numeric-input
        style: slider
      features_position: bottom
      vertical: false
    - type: tile
      entity: number.ecoflow_delta_3_max_plus_energy_backup_reserve
      icon: mdi:battery-heart-outline
      features:
      - type: numeric-input
        style: slider
      features_position: bottom
      vertical: false
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Power flow
      heading_style: title
      icon: mdi:flash
    - type: tile
      entity: sensor.ecoflow_delta_3_max_plus_ac_input_power
      icon: mdi:flash
    - type: tile
      entity: sensor.ecoflow_delta_3_max_plus_solar_input_power
      icon: mdi:solar-power
    - type: tile
      entity: sensor.ecoflow_delta_3_max_plus_solar_2_input_power
      icon: mdi:solar-power
    - type: tile
      entity: sensor.ecoflow_delta_3_max_plus_dc_12v_output_power
      icon: mdi:car-battery
- title: History
  path: history
  type: sections
  max_columns: 4
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Last 30 minutes
      heading_style: title
      icon: mdi:pulse
    - type: custom:apexcharts-card
      header:
        show: false
      graph_span: 30min
      now:
        show: true
      update_interval: 10s
      yaxis:
      - &id001
        id: power
        min: ~0
        max: ~0
        decimals: 0
        align_to: 100
      - &id002
        id: soc
        opposite: true
        min: 0
        max: 100
        decimals: 0
        apex_config:
          tickAmount: 4
          labels:
            style:
              fontSize: 10px
      apex_config:
        chart:
          height: 240
        legend:
          show: true
        tooltip:
          x:
            format: HH:mm:ss
        grid:
          borderColor: rgba(127, 127, 127, 0.25)
          strokeDashArray: 0
        fill:
          type: solid
      series:
      - entity: sensor.ecoflow_delta_3_max_plus_total_output_power
        name: Output
        color: '#4CAF50'
        yaxis_id: power
        type: area
        curve: straight
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        opacity: 0.3
        stroke_width: 1
        group_by:
          func: avg
          duration: 10s
          fill: last
      - entity: sensor.ecoflow_delta_3_max_plus_total_input_power
        name: Input
        color: '#E53935'
        yaxis_id: power
        type: area
        curve: straight
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        opacity: 0.3
        stroke_width: 1
        transform: return x * -1;
        group_by:
          func: avg
          duration: 10s
          fill: last
      - entity: sensor.ecoflow_delta_3_max_plus_battery_level
        name: Battery level
        color: '#9575CD'
        yaxis_id: soc
        type: line
        curve: straight
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        stroke_width: 2
        stroke_dash: 4
        group_by:
          func: avg
          duration: 10s
          fill: last
      grid_options:
        columns: full
        rows: auto
      hours_12: false
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Last 4 hours
      heading_style: title
      icon: mdi:clock-outline
    - type: custom:apexcharts-card
      header:
        show: false
      graph_span: 4h
      now:
        show: true
      update_interval: 1min
      yaxis:
      - *id001
      - *id002
      apex_config:
        chart:
          height: 240
        legend:
          show: true
        tooltip:
          x:
            format: HH:mm
        grid:
          borderColor: rgba(127, 127, 127, 0.25)
          strokeDashArray: 0
        fill:
          type: solid
      series:
      - entity: sensor.ecoflow_delta_3_max_plus_total_output_power
        name: Output
        color: '#4CAF50'
        yaxis_id: power
        type: area
        curve: straight
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        opacity: 0.3
        stroke_width: 1
        group_by:
          func: avg
          duration: 10s
          fill: last
      - entity: sensor.ecoflow_delta_3_max_plus_total_input_power
        name: Input
        color: '#E53935'
        yaxis_id: power
        type: area
        curve: straight
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        opacity: 0.3
        stroke_width: 1
        transform: return x * -1;
        group_by:
          func: avg
          duration: 10s
          fill: last
      - entity: sensor.ecoflow_delta_3_max_plus_battery_level
        name: Battery level
        color: '#9575CD'
        yaxis_id: soc
        type: line
        curve: straight
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        stroke_width: 2
        stroke_dash: 4
        group_by:
          func: avg
          duration: 10s
          fill: last
      grid_options:
        columns: full
        rows: auto
      hours_12: false
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Last 24 hours
      heading_style: title
      icon: mdi:history
    - type: custom:apexcharts-card
      header:
        show: false
      graph_span: 24h
      yaxis:
      - *id001
      - *id002
      apex_config:
        chart:
          height: 240
        legend:
          show: true
        tooltip:
          x:
            format: dd-MM HH:mm
        grid:
          borderColor: rgba(127, 127, 127, 0.25)
          strokeDashArray: 0
        fill:
          type: solid
      series:
      - entity: sensor.ecoflow_delta_3_max_plus_total_output_power
        name: Output
        color: '#4CAF50'
        yaxis_id: power
        type: area
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        opacity: 0.3
        stroke_width: 1
        statistics:
          type: mean
          period: 5minute
          align: middle
      - entity: sensor.ecoflow_delta_3_max_plus_total_input_power
        name: Input
        color: '#E53935'
        yaxis_id: power
        type: area
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        opacity: 0.3
        stroke_width: 1
        transform: return x * -1;
        statistics:
          type: mean
          period: 5minute
          align: middle
      - entity: sensor.ecoflow_delta_3_max_plus_battery_level
        name: Battery level
        color: '#9575CD'
        yaxis_id: soc
        type: line
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        stroke_width: 2
        stroke_dash: 4
        statistics:
          type: mean
          period: 5minute
          align: middle
      grid_options:
        columns: full
        rows: auto
      hours_12: false
